name: CI/CD Pipeline - AWS EC2 Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Health Check Import
        run: |
          python -m py_compile app.py
          python -c "import app; print('App module verified successfully')"

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Notice: EC2_HOST or EC2_SSH_KEY secrets not configured yet in GitHub Settings. Skipping remote SSH step."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Credentials detected. Proceeding with automated deployment."
          fi

      - name: Deploy via SSH
        if: steps.check_creds.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/aws-devops-webapp
            git pull origin main
            sudo docker build -t cloudops-pulse:v1 .
            sudo docker rm -f devops-container || true
            sudo docker run -d --name devops-container --restart always -p 8000:8000 -e AWS_DEPLOYMENT=true -e CICD_ENABLED=true cloudops-pulse:v1
            sleep 2
            curl -f http://127.0.0.1/health || exit 1
